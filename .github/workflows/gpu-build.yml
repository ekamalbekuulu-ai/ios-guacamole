name: gpu-build

# Builds the same kernel as build-all, but also uploads the *patched* XNU tree.
# The GPU patch stack (0201-0220) is ported from ios-rmx1931, and rebasing its
# hunks needs our exact post-patch file contents: this is how we get them.

on:
  workflow_dispatch:
  push:
    paths:
      - 'xnu/patches/**'
      - '.github/workflows/gpu-build.yml'

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549

jobs:
  kernel:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 取 dxb + 应用补丁
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/ 2>/dev/null || true
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: 依赖
        run: |
          brew install jq gum bash cmake ninja || true
          DEV_DIR=$(xcode-select -p 2>/dev/null || true)
          if [ -z "$DEV_DIR" ] || [ ! -d "$DEV_DIR" ]; then
            XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
            [ -n "$XC" ] || XC=/Applications/Xcode.app
            sudo xcode-select -s "$XC"
            DEV_DIR="$XC/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          mkdir -p "$PWD/fake-kdk"
          echo "KDKROOT=$PWD/fake-kdk" >> "$GITHUB_ENV"

      - name: 编内核
        working-directory: dxb
        env:
          MAKEFLAGS: -k
        run: bash build.sh

      - name: 上传补丁后的源码树（用于本地 rebase）
        if: always()
        run: |
          tar czf patched-xnu.tgz \
            --exclude='.git' --exclude='*.o' --exclude='*.a' \
            -C dxb xnu/bsd/dev xnu/bsd/conf xnu/iokit/Kernel/arm xnu/iokit/conf \
            xnu/makedefs 2>/dev/null || true
          ls -la patched-xnu.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-xnu
          path: patched-xnu.tgz
          if-no-files-found: warn

      - name: 收集内核
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
